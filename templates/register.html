<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PriceSense | Register</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}">
<style>
.auth-page{min-height:100vh;display:grid;place-items:center}.auth-card{width:min(440px,100%);padding:2.2rem;border-radius:24px;background:var(--bg-card);border:1px solid var(--border-subtle);box-shadow:0 25px 50px -12px rgba(0,0,0,.7)}.auth-card h1{text-align:center;margin-bottom:.4rem;background:linear-gradient(135deg,#c084fc,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.auth-card p{text-align:center;color:var(--text-muted);margin-bottom:1.6rem}.auth-card label{display:block;margin:1rem 0 .45rem;color:#cbd5e1;font-weight:600}.auth-card input{width:100%;padding:1rem;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.45);color:white;outline:none}.auth-btn{width:100%;margin-top:1.4rem;padding:1rem;border:0;border-radius:12px;color:white;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--brand-primary),var(--brand-secondary))}.auth-link{display:block;text-align:center;margin-top:1.2rem;color:#c084fc;text-decoration:none}.flash{padding:.8rem 1rem;border-radius:10px;margin-bottom:1rem;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#fca5a5}
</style></head><body><div class="auth-page"><div class="auth-card">
<h1>⚡ PriceSense</h1><p>Create your account.</p>
{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash">{{ message }}</div>{% endfor %}{% endwith %}
<form method="POST">
<label for="name">Full Name</label><input id="name" name="name" type="text" required autocomplete="name">
<label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email">
<label for="password">Password</label><input id="password" name="password" type="password" minlength="6" required autocomplete="new-password">
<label for="confirm_password">Confirm Password</label><input id="confirm_password" name="confirm_password" type="password" minlength="6" required autocomplete="new-password">
<button class="auth-btn" type="submit">Create Account</button></form>
<a class="auth-link" href="{{ url_for('login') }}">Already have an account? Login</a>
</div></div></body></html>
