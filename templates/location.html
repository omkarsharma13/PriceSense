<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PriceSense | Location</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}">
<style>
.auth-page{min-height:100vh;display:grid;place-items:center}.auth-card{width:min(520px,100%);padding:2.2rem;border-radius:24px;background:var(--bg-card);border:1px solid var(--border-subtle);box-shadow:0 25px 50px -12px rgba(0,0,0,.7)}.auth-card h1{text-align:center;margin-bottom:.5rem;background:linear-gradient(135deg,#c084fc,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.auth-card p{text-align:center;color:var(--text-muted);margin-bottom:1.6rem}.auth-card select{width:100%;padding:1rem;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:#12121a;color:white;outline:none}.auth-btn{width:100%;margin-top:1.4rem;padding:1rem;border:0;border-radius:12px;color:white;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--brand-primary),var(--brand-secondary))}.auth-link{display:block;text-align:center;margin-top:1rem;color:#c084fc;text-decoration:none}.flash{padding:.8rem 1rem;border-radius:10px;margin-bottom:1rem;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#fca5a5}
</style></head><body><div class="auth-page"><div class="auth-card">
<h1>📍 Choose your location</h1><p>Select your city before comparing prices.</p>
{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash">{{ message }}</div>{% endfor %}{% endwith %}
<form method="POST"><select name="location" required>{% for key,item in locations.items() %}<option value="{{ key }}" {% if key==selected_key %}selected{% endif %}>{{ item.name }} ({{ item.pincode }})</option>{% endfor %}</select><button class="auth-btn" type="submit">Continue to Dashboard</button></form>
<a class="auth-link" href="{{ url_for('logout') }}">Logout</a>
</div></div></body></html>
